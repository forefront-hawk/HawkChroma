<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090E">
<title>HawkChroma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700;800&family=Orbitron:wght@600;800&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090E;--panel:#12141A;--line:#262A34;--text:#F1F5F9;--mute:#94A3B8;--plate:#4B505C;--accent:#38BDF8;
  --deck1:#1A1C23;--deck2:#101216;--deck-border:#2D323E;--plate-border:#6E7485;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark
}
@media(prefers-color-scheme:light){:root[data-theme="auto"]{--bg:#E8EBF0;--panel:#F8FAFC;--line:#CBD5E1;--text:#0F172A;--mute:#475569;--plate:#8B93A3;--deck1:#CBD5E1;--deck2:#94A3B8;--deck-border:#64748B;color-scheme:light}}
:root[data-theme="light"]{--bg:#E8EBF0;--panel:#F8FAFC;--line:#CBD5E1;--text:#0F172A;--mute:#475569;--plate:#8B93A3;--deck1:#CBD5E1;--deck2:#94A3B8;--deck-border:#64748B;color-scheme:light}
:root[data-theme="midnight"]{--bg:#020617;--panel:#0F172A;--line:#1E293B;--text:#E2E8F0;--mute:#64748B;--plate:#1E293B;--deck1:#0F172A;--deck2:#020617;--deck-border:#334155}
:root[data-theme="cyberpunk"]{--bg:#0D0221;--panel:#19053B;--line:#4C1D95;--text:#F0ABFC;--mute:#C084FC;--plate:#2E1065;--deck1:#240046;--deck2:#10002B;--deck-border:#7E22CE}
:root[data-theme="emerald"]{--bg:#021612;--panel:#062821;--line:#0F4C3E;--text:#D1FAE5;--mute:#6EE7B7;--plate:#114237;--deck1:#06342B;--deck2:#021B16;--deck-border:#059669}
:root[data-theme="crimson"]{--bg:#160408;--panel:#280911;--line:#501322;--text:#FFE4E6;--mute:#FDA4AF;--plate:#3F101C;--deck1:#310B15;--deck2:#190409;--deck-border:#BE123C}
:root[data-theme="nord"]{--bg:#2E3440;--panel:#3B4252;--line:#4C566A;--text:#ECEFF4;--mute:#D8DEE9;--plate:#434C5E;--deck1:#3B4252;--deck2:#2E3440;--deck-border:#4C566A}
:root[data-theme="solarlight"]{--bg:#FDF6E3;--panel:#EEE8D5;--line:#D3CBB7;--text:#073642;--mute:#586E75;--plate:#93A1A1;--deck1:#E1DBCA;--deck2:#D3CBB7;--deck-border:#93A1A1;color-scheme:light}
:root[data-theme="solardark"]{--bg:#002B36;--panel:#073642;--line:#2AA198;--text:#93A1A1;--mute:#657B83;--plate:#0A4452;--deck1:#073642;--deck2:#00212B;--deck-border:#586E75}
:root[data-theme="mocha"]{--bg:#1E1E2E;--panel:#181825;--line:#313244;--text:#CDD6F4;--mute:#A6ADC8;--plate:#45475A;--deck1:#26273B;--deck2:#11111B;--deck-border:#585B70}
:root[data-theme="contrast"]{--bg:#000000;--panel:#0A0A0A;--line:#FFFFFF;--text:#FFFFFF;--mute:#E2E8F0;--plate:#1F1F1F;--deck1:#0A0A0A;--deck2:#000000;--deck-border:#FFFFFF}
:root[data-theme="matrix"]{--bg:#010902;--panel:#031606;--line:#00FF41;--text:#00FF41;--mute:#15803D;--plate:#042409;--accent:#00FF41;--deck1:#031A07;--deck2:#010802;--deck-border:#00FF41;--plate-border:#22C55E;--font:"JetBrains Mono",ui-monospace,monospace}

/* Party Mode Full-UI Rainbow Styling */
body.party-mode{transition:none!important}
body.party-mode .bar,body.party-mode .side,body.party-mode .deck,body.party-mode .plate{border-color:var(--accent)!important;box-shadow:0 0 22px var(--accent)!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:500 13.5px/1.4 var(--font);min-height:100vh;overflow-x:hidden;transition:background-color .18s,color .18s}
.wrap{max-width:1180px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.bar-head{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.bar-body{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;padding-top:6px;border-top:1px solid var(--line)}

button,select,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 9px;min-height:35px;touch-action:manipulation;cursor:pointer}
button:hover{filter:brightness(1.12)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent);min-height:auto}
input[type=color]{padding:2px;width:42px;min-height:32px;height:32px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px}.brand i{font-style:normal;color:var(--accent)}
.chip{font:600 11px var(--mono);padding:3px 8px;border-radius:8px;border:1px solid var(--line);color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:2px;border:1px solid var(--line);border-radius:11px;padding:2px;max-width:100%}
.seg button{flex:1 1 auto;text-align:center;border:0;min-height:28px;padding:3px 7px;background:none;color:var(--mute);font-weight:700;font-size:11.5px;border-radius:8px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#04121C}
.readout{display:flex;align-items:center;gap:10px;flex:1 1 200px}
#sw{width:26px;height:26px;border-radius:7px;border:2px solid var(--text);flex:none}
#out{font:700 14px var(--mono)}
#toast{color:var(--mute);font-size:11.5px;min-height:15px}
label{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:12.5px}

.deck{display:flex;flex-direction:column;gap:12px;background:linear-gradient(145deg,var(--deck1),var(--deck2));border:3px solid var(--deck-border);border-radius:22px;padding:12px}
@media(min-width:920px){.deck{flex-direction:row}}
.plate{flex:1;min-width:0;background:var(--plate);border:2px solid var(--plate-border);border-radius:16px;padding:10px;box-shadow:inset 0 3px 10px rgba(0,0,0,.55);transition:background-color .2s}
#banner{font:700 11.5px var(--mono);color:#FDE68A;margin:0 0 8px 2px}
#grid{display:grid;grid-template-columns:repeat(var(--cols,10),minmax(0,1fr));grid-auto-rows:var(--kh,76px);gap:var(--gp,6px)}
.key{position:relative;min-width:0;padding:3px;border-radius:10px;background:#1B1E26;border:2px solid var(--k);box-shadow:0 0 var(--glow-r,10px) var(--k);cursor:pointer;transition:transform .07s}
.key:active,.key.hit{transform:translateY(3px) scale(.96)}
.key.sel{outline:3px solid #fff;outline-offset:2px}
.cap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-radius:7px;padding:4px 2px 3px;background:linear-gradient(180deg,#fff,#E2E8F0);color:#0F172A;overflow:hidden;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);font-family:var(--font)}
.cap b{display:block;width:100%;height:28%;max-height:16px;border-radius:4px;background:var(--k);border:1px solid rgba(0,0,0,.25)}
.cap span{font:800 clamp(7.5px,2.4vw,11.5px) var(--font);max-width:100%;overflow:hidden;white-space:nowrap}
.cap small{font:600 8.5px var(--mono);color:#64748B}
.dense .cap small{display:none}

.side{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;min-width:248px}
#ring{--rp:12px;border-radius:50%;padding:var(--rp);border:2px solid rgba(255,255,255,.3);background:var(--rb,#10B98160);box-shadow:0 0 30px var(--rc,#10B981)}
#ring.rainbow{--rp:calc(var(--dsn,150px)*.1);background:var(--rg)}
#ring.min{background:none;border-color:var(--rc)}
#knob{position:relative;width:calc(var(--dsn,150px) - 2*var(--rp));height:calc(var(--dsn,150px) - 2*var(--rp));border-radius:50%;background:radial-gradient(circle at 35% 35%,#323640,#14161B 78%);border:5px dashed #5C6270;touch-action:none;cursor:grab}
#knob.assign{border-color:#F43F5E;box-shadow:0 0 26px rgba(244,63,94,.7)}
#ring.rainbow #knob{background:#14161B;border:3px solid #0008}
#ring.min #knob{background:var(--rc);border:0;box-shadow:none}
#ring.min #notch{background:#000a}
#notch{width:max(5px,calc(var(--dsn,150px)*.045));height:calc(var(--dsn,150px)*.17);background:#fff;border-radius:4px;margin:6px auto 0}
#kinfo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none;color:#fff;font:700 calc(var(--dsn,150px)*.075) var(--mono)}
#angle{font-size:calc(var(--dsn,150px)*.1)}
#hue{width:100%;max-width:240px}
.side button{width:100%}
#assignBtn[aria-pressed="true"],#fsAssign[aria-pressed="true"]{background:#E11D48;border-color:#FB7185;color:#fff}
.hint{font-size:11.5px;color:var(--mute);text-align:center;margin:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%}
.subcard{background:rgba(0,0,0,0.18);border:1px solid var(--line);border-radius:11px;padding:8px 10px;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.subhead{font:800 11px var(--mono);text-transform:uppercase;color:var(--accent);letter-spacing:0.5px;margin-right:6px}

#grid[data-shape="square"] .key,#grid[data-shape="square"] .cap{border-radius:3px}
#grid[data-shape="oval"] .key,#grid[data-shape="oval"] .cap{border-radius:50%}
#grid[data-glow="off"] .key{box-shadow:none}
#grid[data-hex="off"] .cap small{display:none}
#grid[data-cap="flat"] .cap{background:var(--k);color:#fff;text-shadow:0 1px 2px #000a}
#grid[data-cap="flat"] .cap b{display:none}
#grid[data-cap="flat"] .cap small{color:#fff}
#grid[data-cap="dark"] .cap{background:#1E2028;color:#F1F5F9}
#grid[data-cap="dark"] .cap small{color:#94A3B8}
#grid[data-cap="ceramic"] .cap{background:linear-gradient(180deg,#FFFFFF,#F8FAFC);border:1px solid #CBD5E1;color:#020617}

.sl{flex:1 1 0;min-width:0}
.sl input{flex:1;min-width:0;width:100%}
.sl b{min-width:2.4em;text-align:right;font:700 12px var(--mono)}
#ro{justify-content:center;gap:14px}
#ro span{font:700 clamp(10px,1.8dvh,14px) var(--mono);white-space:nowrap}
#roSw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--text)}


/* Safari & Non-Fullscreen Viewport Optimization */
html{-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none}
.modal-bg{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
@media(max-height:760px){
  .wrap{padding:6px;gap:5px}
  .bar{padding:5px 8px;border-radius:11px}
  .deck{padding:8px;gap:8px}
  #grid{grid-auto-rows:var(--kh,62px)}
}
@media(max-width:640px){
  .wrap{padding:6px;gap:6px}
  .bar{padding:6px 8px;gap:6px}
  .bar-body{gap:6px}
  .seg{width:100%}
  button,select,input{padding:4px 7px;min-height:32px;font-size:12px;max-width:100%}
  select{text-overflow:ellipsis}
  .subcard{padding:6px 8px;gap:6px}
  .subcard label{flex:1 1 44%;justify-content:space-between}
  .subcard label select{max-width:65%}
  body:not(.fs) #grid{grid-template-columns:repeat(min(var(--cols,10),5),minmax(0,1fr));grid-auto-rows:var(--kh,60px)}
}

/* ========================================================================== */
/* 20 FUNCTIONAL OVERLAYS (SEPARATE FROM UI THEMES — KEYS + FULLSCREEN 2ND UI)*/
/* ========================================================================== */
/* 1. mech-ibm: IBM Model M Buckling Spring (1984) */
[data-ov="mech-ibm"] .deck,[data-ov="mech-ibm"] #fsbar,[data-ov="mech-ibm"] #fsDrawer{background:#D6D2C4!important;border:3px outset #F5F2E8!important;border-radius:6px!important;color:#1E1E1E!important}
[data-ov="mech-ibm"] .plate{background:#A39E93!important;border:3px inset #858075!important;border-radius:4px!important}
[data-ov="mech-ibm"] .key{background:#7A756C!important;border-radius:4px!important;padding:5px 4px 7px!important;box-shadow:0 3px 0 #3D3A35!important}
[data-ov="mech-ibm"] .cap{background:linear-gradient(180deg,#FAF8F0,#DFDBD0)!important;color:#111!important;border-radius:3px!important;border:1px solid #B8B3A6!important}
[data-ov="mech-ibm"] #fsbar button,[data-ov="mech-ibm"] #fsDrawer button{background:#EAE6D9!important;color:#111!important;border:2px outset #FFF!important;border-radius:3px!important;font-family:"Courier New",monospace!important}

/* 2. mech-c64: Commodore 64 Breadbin (1982) */
[data-ov="mech-c64"] .deck,[data-ov="mech-c64"] #fsbar,[data-ov="mech-c64"] #fsDrawer{background:#96897B!important;border:4px solid #6E6256!important;border-radius:16px!important}
[data-ov="mech-c64"] .plate{background:#42382F!important;border:2px solid #29221C!important}
[data-ov="mech-c64"] .key{background:#30261E!important;border-radius:8px!important;padding:5px!important}
[data-ov="mech-c64"] .cap{background:linear-gradient(180deg,#5C4E43,#453930)!important;color:#F5F0EB!important;border-radius:6px!important}
[data-ov="mech-c64"] .cap small{color:#D6C7B8!important}
[data-ov="mech-c64"] #fsbar button,[data-ov="mech-c64"] #fsDrawer button{background:#5C4E43!important;color:#F5F0EB!important;border:2px solid #C84B31!important;border-radius:6px!important}

/* 3. mech-cyber: Cyberpunk Neon Acrylic Custom */
[data-ov="mech-cyber"] .deck,[data-ov="mech-cyber"] #fsbar,[data-ov="mech-cyber"] #fsDrawer{background:rgba(16,6,36,0.92)!important;border:2px solid #00F0FF!important;box-shadow:0 0 25px #FF005580,inset 0 0 15px #00F0FF50!important;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
[data-ov="mech-cyber"] .key{background:#090214!important;border:2px solid var(--k)!important;box-shadow:0 0 16px var(--k),inset 0 0 8px var(--k)!important;border-radius:2px!important}
[data-ov="mech-cyber"] .cap{background:rgba(10,12,24,0.82)!important;color:#00F0FF!important;border:1px solid var(--k)!important;border-radius:2px!important}
[data-ov="mech-cyber"] #fsbar button,[data-ov="mech-cyber"] #fsDrawer button{background:#120428!important;color:#FCE7F3!important;border:1px solid #00F0FF!important;border-radius:2px!important}

/* 4. mech-typewriter: Vintage Brass & Ivory Typewriter */
[data-ov="mech-typewriter"] .deck,[data-ov="mech-typewriter"] #fsbar,[data-ov="mech-typewriter"] #fsDrawer{background:linear-gradient(145deg,#2B2118,#17110B)!important;border:3px solid #C5A059!important;border-radius:18px!important}
[data-ov="mech-typewriter"] .plate{background:#1A140F!important;border:2px solid #D4AF37!important}
[data-ov="mech-typewriter"] .key{border-radius:50%!important;background:#D4AF37!important;border:3px solid #FFF3B0!important;padding:4px!important;box-shadow:0 4px 8px #000!important}
[data-ov="mech-typewriter"] .cap{border-radius:50%!important;background:radial-gradient(circle,#FFFDF5 60%,#E6DEC8 100%)!important;color:#1C1611!important;font-family:Georgia,serif!important}
[data-ov="mech-typewriter"] #fsbar button,[data-ov="mech-typewriter"] #fsDrawer button{border-radius:999px!important;background:#292016!important;color:#FDE68A!important;border:2px solid #D4AF37!important}

/* 5. mech-arcade: Arcade Sanwa Fightstick Buttons */
[data-ov="mech-arcade"] .deck,[data-ov="mech-arcade"] #fsbar,[data-ov="mech-arcade"] #fsDrawer{background:#141824!important;border:4px solid #EF4444!important;border-radius:20px!important}
[data-ov="mech-arcade"] .key{border-radius:50%!important;background:#0F131D!important;border:4px solid var(--k)!important;padding:5px!important}
[data-ov="mech-arcade"] .cap{border-radius:50%!important;background:radial-gradient(circle at 35% 30%,#FFFFFF,var(--k) 65%)!important;color:#090D16!important;text-shadow:0 1px 0 #FFF!important;box-shadow:inset 0 -4px 6px rgba(0,0,0,0.45)!important}
[data-ov="mech-arcade"] .cap b{display:none!important}
[data-ov="mech-arcade"] #fsbar button,[data-ov="mech-arcade"] #fsDrawer button{border-radius:999px!important;border:2px solid #F59E0B!important;font-weight:900!important}

/* 6. plug-vst: Analog Audio Compressor Rack (VST / 19" Rackmount) */
[data-ov="plug-vst"] .deck,[data-ov="plug-vst"] #fsbar,[data-ov="plug-vst"] #fsDrawer{background:linear-gradient(180deg,#2A2D34,#1C1E24)!important;border:3px solid #525866!important;border-radius:4px!important;box-shadow:inset 0 0 0 2px #111!important}
[data-ov="plug-vst"] .plate{background:#181A20!important;border:2px solid #3C414C!important;border-radius:4px!important}
[data-ov="plug-vst"] .key{background:#121318!important;border:1px solid #4A505E!important;border-radius:3px!important;box-shadow:inset 0 1px 0 #666!important}
[data-ov="plug-vst"] .cap{background:linear-gradient(180deg,#2E323C,#20232A)!important;color:#FBBF24!important;border-radius:2px!important}
[data-ov="plug-vst"] .cap small{color:#38BDF8!important}
[data-ov="plug-vst"] #fsbar button,[data-ov="plug-vst"] #fsDrawer button{background:#22252D!important;color:#FBBF24!important;border:1px solid #525866!important;border-radius:3px!important}

/* 7. plug-eurorack: Eurorack Modular Synth Patchbay */
[data-ov="plug-eurorack"] .deck,[data-ov="plug-eurorack"] #fsbar,[data-ov="plug-eurorack"] #fsDrawer{background:#D8DCE3!important;border:3px solid #8C95A6!important;border-radius:4px!important;color:#111827!important}
[data-ov="plug-eurorack"] .plate{background:#CBD2DC!important;border:2px dashed #475569!important;border-radius:4px!important}
[data-ov="plug-eurorack"] .key{background:#1E293B!important;border:3px solid #94A3B8!important;border-radius:8px!important}
[data-ov="plug-eurorack"] .cap{background:#0F172A!important;color:#38BDF8!important;border:2px solid var(--k)!important}
[data-ov="plug-eurorack"] #fsbar button,[data-ov="plug-eurorack"] #fsDrawer button{background:#1E293B!important;color:#F8FAFC!important;border:2px solid #475569!important;border-radius:4px!important}

/* 8. plug-mpc: Akai MPC Studio Velocity Rubber Drum Pads */
[data-ov="plug-mpc"] .deck,[data-ov="plug-mpc"] #fsbar,[data-ov="plug-mpc"] #fsDrawer{background:#232529!important;border:3px solid #B91C1C!important;border-radius:10px!important}
[data-ov="plug-mpc"] .plate{background:#17181B!important;border:2px solid #3F434C!important;border-radius:6px!important}
[data-ov="plug-mpc"] .key{background:#2E3138!important;border:3px solid var(--k)!important;border-radius:4px!important;box-shadow:0 0 14px var(--k)!important;padding:2px!important}
[data-ov="plug-mpc"] .cap{background:radial-gradient(circle,#4B505B 10%,#2B2E35 90%)!important;color:#F8FAFC!important;border-radius:3px!important}
[data-ov="plug-mpc"] .cap b{height:6px!important;border-radius:1px!important}
[data-ov="plug-mpc"] #fsbar button,[data-ov="plug-mpc"] #fsDrawer button{background:#2B2E35!important;color:#FCA5A5!important;border:1px solid #EF4444!important;border-radius:4px!important}

/* 9. plug-dmx: GrandMA Stage Lighting Console Wing */
[data-ov="plug-dmx"] .deck,[data-ov="plug-dmx"] #fsbar,[data-ov="plug-dmx"] #fsDrawer{background:#0B0D12!important;border:2px solid #F59E0B!important;border-radius:12px!important}
[data-ov="plug-dmx"] .plate{background:#141821!important;border:1px solid #F59E0B!important}
[data-ov="plug-dmx"] .key{background:#000!important;border:2px solid var(--k)!important;border-radius:6px!important}
[data-ov="plug-dmx"] .cap{background:#161A24!important;color:#FDE047!important;border-top:4px solid var(--k)!important}
[data-ov="plug-dmx"] #fsbar button,[data-ov="plug-dmx"] #fsDrawer button{background:#161A24!important;color:#FDE047!important;border:1px solid #F59E0B!important}

/* 10. plug-davinci: DaVinci Resolve Colorist Grading Panel */
[data-ov="plug-davinci"] .deck,[data-ov="plug-davinci"] #fsbar,[data-ov="plug-davinci"] #fsDrawer{background:#16171A!important;border:2px solid #3F444E!important;border-radius:14px!important}

/* OLD-SCHOOL HTML / PIXEL KEYCAP FX LAYER (.fx-box inside every keycap)      */
/* ========================================================================== */
.cap { position:relative; z-index:1; }
.fx-box {
  display:none;
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  border-radius:inherit;
}
#grid[data-kfx] .fx-box { display:flex; align-items:center; justify-content:center; }
#grid[data-kfx] .cap { background:#080B10!important; color:#FFFFFF!important; }
#grid[data-kfx] .cap > b { position:relative; z-index:2; height:3px!important; opacity:0.85; }
#grid[data-kfx] .cap > span {
  position:relative; z-index:2;
  background:rgba(5,8,14,0.72);
  padding:0 4px;
  border-radius:3px;
  color:var(--k)!important;
  text-shadow:0 1px 2px #000!important;
  border:1px solid rgba(255,255,255,0.12);
}
#grid[data-kfx] .cap > small {
  position:relative; z-index:2;
  background:rgba(5,8,14,0.78);
  padding:0 3px;
  border-radius:2px;
  color:#F8FAFC!important;
}

/* Old-School HTML Pixel Table for Flame & Plasma */
.px-tbl { width:100%; height:100%; border-collapse:collapse; table-layout:fixed; }
.px-tbl td { padding:0; margin:0; transition:opacity 0.08s linear; }

/* Matrix Numbers Old-School HTML Table/Stream */
.mtx-stream {
  width:100%; height:100%;

.hist-dot {
  width:18px; height:18px; border-radius:5px; border:1px solid rgba(255,255,255,0.45);

}
.hist-dot:hover { transform:scale(1.18); }

/* Color Math */
function rgb(h){var n=parseInt(h.slice(1),16);return{r:n>>16&255,g:n>>8&255,b:n&255}}
function hsl(h){var c=rgb(h),r=c.r/255,g=c.g/255,b=c.b/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),H=0,Sa=0,L=(mx+mn)/2;
if(mx!==mn){var d=mx-mn;Sa=L>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H/=6}
return{h:Math.round(H*360),s:Math.round(Sa*100),l:Math.round(L*100)}}
function hslHex(h,s,l){l/=100;var a=s*Math.min(l,1-l)/100;
function f(n){var k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(Math.min(k-3,9-k,1),-1))).toString(16).padStart(2,"0")}
return("#"+f(0)+f(8)+f(4)).toUpperCase()}
function hexTxt(h){var x=S.hash?h:h.slice(1);return S.lower?x.toLowerCase():x}
function fmt(h,label){
  h=h.toUpperCase();
  if(S.fmt==="hex")return hexTxt(h);
  var c=rgb(h);
  if(S.fmt==="rgb")return"rgb("+c.r+", "+c.g+", "+c.b+")";
  if(S.fmt==="hsl"){var v=hsl(h);return"hsl("+v.h+", "+v.s+"%, "+v.l+"%)"}
  if(S.fmt==="win"){
    return S.conn==="windows"?"WIN_RGB("+c.r+","+c.g+","+c.b+")|"+h:"--hawk-"+(label||"color").toLowerCase().replace(/[^a-z0-9]/g,"-")+": "+h+";";
  }
  return h;
}

/* Non-Repeating Hue Generator: Guarantees every key on the keyboard (from 20 keys up to the max 6x12 = 72 keys) has a unique, non-repeating hue & chromatic coordinate by default! */
function themeColors(t,n){
  var out=[],p=t.p||[],used={};
  if(t.x&&p.length===n){
    return p.slice();
  }
  // Analyze theme anchor characteristics (average saturation & lightness range)
  var sats=[],lits=[],hues=[];
  for(var k=0;k<p.length;k++){
    var q=hsl(p[k]);
    hues.push(q.h);sats.push(q.s);lits.push(q.l);
  }
  var avgS=sats.length?Math.round(sats.reduce(function(a,b){return a+b},0)/sats.length):86;
  var isMono=(t.n==="Mono"||avgS<18);
  var isMatrix=(t.n==="Matrix Code");

  for(var i=0;i<n;i++){
    var hex;
    if(isMono){
      // For Monochrome theme, distribute 72 distinct stepped luminance + subtle cool-blue/slate tint shifts so no two keys repeat
      var lStep=Math.round(96-(i/(Math.max(1,n-1)))*84);
      var hStep=(200+(i*5))%360;
      var sStep=8+(i%5)*4;
      hex=hslHex(hStep,sStep,lStep);
    }else if(isMatrix){
      // Matrix theme: distribute across phosphor emerald-chartreuse-jade spectrum (95° to 168°) with unique lightness steps
      var mh=Math.round(95+(i/Math.max(1,n))*75)%360;
      var ml=22+((i*17)%62);
      hex=hslHex(mh,92,ml);
    }else{
      // Distribute hues evenly across the 360° chromatic circle anchored at the palette's starting hue, with golden-angle micro-offsets so no two keys ever share the same hue!
      var startH=hues[0]||0;
      var row=(i/S.cols)|0,col=i%S.cols;
      var hVal=Math.round(startH+(i*(360/Math.max(1,n)))+(row*3.5))%360;
      var baseQ=hsl(p[i%p.length]);
      var sVal=Math.max(62,Math.min(98,baseQ.s||avgS));
      // Alternate lightness subtly by row so multi-row matrices have crisp visual separation as well as unique hues
      var lBase=Math.max(36,Math.min(76,baseQ.l||54));
      var lShift=((row%3)-1)*7;
      var lVal=Math.max(28,Math.min(82,lBase+lShift));
      hex=hslHex(hVal,sVal,lVal);
    }
    // Guarantee strict uniqueness across all n keys (up to 72 keys)
    var guard=0;
    while(used[hex]&&guard<36){
      var qq=hsl(hex);
      hex=hslHex((qq.h+5)%360,qq.s,Math.max(25,Math.min(85,qq.l+(guard%2?4:-4))));
      guard++;
    }
    used[hex]=true;
    out.push(hex);
  }
  return out;
}

/* Multi-Profile Web Audio Synthesizer */
var actx=null;
function click(f,d){
  if(!S.sound)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!actx)actx=new AC();if(actx.state==="suspended")actx.resume();
    var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime,st=S.sndType;
    if(st==="cherry"){
      o.type="triangle";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(160,t+d);
      g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    }else if(st==="linear"){
      o.type="sine";o.frequency.setValueAtTime(f*0.32,t);o.frequency.exponentialRampToValueAtTime(75,t+d*1.5);
      g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.001,t+d*1.5);d*=1.5;
    }else if(st==="bubble"){
      o.type="sine";o.frequency.setValueAtTime(f*0.4,t);o.frequency.exponentialRampToValueAtTime(f*0.85,t+d*1.2);
      g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+d*1.2);d*=1.2;
    }else if(st==="beeps"){
      o.type="square";o.frequency.setValueAtTime(f*0.55,t);
      g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d*1.1);

/* CSV Export & Import */
function csvEscape(val){
  var s=String(val==null?"":val);
  if(s.indexOf(",")>-1||s.indexOf('"')>-1||s.indexOf("\n")>-1)return'"'+s.replace(/"/g,'""')+'"';
  return s;
}
function parseCsvLine(line){
  var res=[],cur="",inQ=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(inQ){
      if(ch==='"'&&line[i+1]==='"'){cur+='"';i++}
      else if(ch==='"')inQ=false;
      else cur+=ch;
    }else{
      if(ch==='"')inQ=true;
      else if(ch===','){res.push(cur);cur=""}
      else cur+=ch;
    }
  }
  res.push(cur);return res;
}

function exportConfigCsv(){
  var lines=["section,key,index,value,extra"];
  var st=serializeState();
  ["rows","cols","ti","conn","profile","fmt","copy","sound","sndType","mode","cBg","cPanel","cText","cPlate","font","plateMat","idle"].concat(Object.keys(OPT)).forEach(function(k){
    lines.push(["setting",k,0,csvEscape(st[k]),""].join(","));
  });
  for(var i=0;i<S.keys.length;i++){
    lines.push(["cell","key",i,csvEscape(S.keys[i]),csvEscape(S.labels[i]||"")].join(","));
  }
  S.custom.forEach(function(ct,idx){
    lines.push(["palette",csvEscape(ct.n),idx,csvEscape(ct.p.join(" ")),""].join(","));
  });
  S.customUiThemes.forEach(function(ut,idx){
    lines.push(["uitheme",csvEscape(ut.n),idx,csvEscape([ut.bg,ut.panel,ut.text,ut.plate].join(" ")),""].join(","));
  });
  var blob=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob),a=D.createElement("a");
  a.href=url;a.download="hawkchroma_config_"+S.rows+"x"+S.cols+".csv";
  D.body.appendChild(a);a.click();D.body.removeChild(a);URL.revokeObjectURL(url);
  toast("Exported configuration CSV ("+lines.length+" rows)");
}

$("csvFileInput").onchange=function(e){
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var text=String(ev.target.result||""),rows=text.split(/\r?\n/);
      var cfg={},keys=[],labels=[],palettes=[],uithemes=[];
      for(var i=1;i<rows.length;i++){
        var line=rows[i].trim();if(!line)continue;
        var cols=parseCsvLine(line),sec=cols[0],k=cols[1],idx=parseInt(cols[2],10)||0,val=cols[3],ext=cols[4]||"";
        if(sec==="setting"){
          if(val==="true")cfg[k]=true;
          else if(val==="false")cfg[k]=false;
          else if(!isNaN(Number(val))&&val.trim()!=="")cfg[k]=Number(val);
          else cfg[k]=val;
        }else if(sec==="cell"){
          keys[idx]=val.toUpperCase();labels[idx]=ext;
        }else if(sec==="palette"){
          palettes.push({n:k,p:val.split(" ").filter(Boolean),x:true});
        }else if(sec==="uitheme"){
          var pts=val.split(" ");
          if(pts.length>=4)uithemes.push({n:k,bg:pts[0],panel:pts[1],text:pts[2],plate:pts[3]});
        }
      }
      if(keys.length)cfg.keys=keys;
      if(labels.length)cfg.labels=labels;
      if(palettes.length)cfg.custom=palettes;
      if(uithemes.length)cfg.customUiThemes=uithemes;
      loadStateObject(cfg);
      fullRefreshUi();save();
      toast("Imported CSV Configuration Successfully!");
    }catch(err){
      toast("Invalid CSV file format");
    }
    $("csvFileInput").value="";
  };
  reader.readAsText(file);
};

function kfxLoop(t){
  if(S.keyFx==="off"||S.demo)return;
  if(t-S.kfxT0>105){
    S.kfxT0=t;
    S.kfxTick=(S.kfxTick+1)%360;
    var fx=S.keyFx,n=cells.length;

    for(var i=0;i<n;i++){
      var b=cells[i];if(!b)continue;
      var box=b.children[0].children[0];if(!box)continue;
      var hex=S.keys[i]||"#10B981";
      b.style.setProperty("--k",hex);

      if(fx==="flame"){
        // Animate 6x5 Pixel Flame Table in THIS key's exact color (rising heat map from bottom row r=4 to top row r=0)
        var tds=box.getElementsByTagName("td");
        if(tds.length===30){
          for(var r=0;r<5;r++){
            for(var c=0;c<6;c++){
              var idx=r*6+c;
              // Base rows (r=3,4) are hottest; upper rows flicker like rising pixel fire tongues
              var wave=Math.sin((S.kfxTick*0.65)+(c*1.4)-(r*1.2)+(i*0.7));
              var heat=((r/4)*0.78)+(wave*0.32);
              var op=heat>0.38?Math.min(1,Math.max(0.12,heat)):0.04;
              tds[idx].style.background=hex;
              tds[idx].style.opacity=op.toFixed(2);
            }
          }
        }
      }else if(fx==="plasma"){
        // Animate 6x5 Pixel Plasma Cellular Grid in THIS key's exact color
        var ptds=box.getElementsByTagName("td");
        if(ptds.length===30){
          for(var pr=0;pr<5;pr++){
            for(var pc=0;pc<6;pc++){
              var pidx=pr*6+pc;
              var pv=Math.sin(pc*0.8+S.kfxTick*0.3+i)+Math.cos(pr*0.9-S.kfxTick*0.25);
              var pop=0.18+((pv+2)/4)*0.82;
              ptds[pidx].style.background=hex;
              ptds[pidx].style.opacity=pop.toFixed(2);
            }
          }
        }
      }else if(fx==="line"){
        // Animate SVG Line Chart points in THIS key's color
        var poly=box.querySelector("polyline"),area=box.querySelector("polygon");
        if(poly&&area){
          var pts=[];
          for(var x=0;x<=60;x+=12){
            var y=Math.round(18+Math.sin((S.kfxTick*0.35)+(x*0.15)+(i*0.8))*13);
            pts.push(x+","+y);
          }
          var ptStr=pts.join(" ");
          poly.setAttribute("points",ptStr);
          poly.setAttribute("stroke",hex);
          area.setAttribute("points","0,36 "+ptStr+" 60,36");
          area.setAttribute("fill",hex);
        }
      }else if(fx==="gauge"){
        // Animate Car Dial Tachometer Needle & Arc in THIS key's color
        var needle=box.querySelector("line"),paths=box.querySelectorAll("path");
        if(needle){
          var rpmAngle=-115+Math.sin((S.kfxTick*0.28)+(i*0.65))*105;
          needle.setAttribute("transform","rotate("+Math.round(rpmAngle)+" 30 32)");
          needle.setAttribute("stroke",hex);
          if(paths[1])paths[1].setAttribute("stroke",hex);
        }
      }else if(fx==="matrix-num"){
        // Old-School HTML Matrix Numbers scrolling in THIS key's exact color
        var mdiv=box.firstChild;
        if(mdiv){
          mdiv.style.color=hex;
          mdiv.style.textShadow="0 0 5px "+hex;
          var spans=mdiv.children;
          for(var sIdx=0;sIdx<spans.length;sIdx++){
            var numStr="";
            for(var d=0;d<6;d++){
              numStr+=((S.kfxTick+i*3+sIdx*7+d*5)%10);
            }
            spans[sIdx].textContent=numStr;
            spans[sIdx].style.opacity=(0.45+((sIdx+S.kfxTick)%4)*0.18).toFixed(2);
          }
        }
      }else if(fx==="bars"){
        // Animate 5 Colored Bar Chart columns in THIS key's color
        var bdiv=box.firstChild;
        if(bdiv&&bdiv.children){
          for(var bi=0;bi<bdiv.children.length;bi++){
            var bh=18+Math.abs(Math.round(Math.sin((S.kfxTick*0.4)+(bi*1.1)+(i*0.5))*78));
            bdiv.children[bi].style.height=bh+"%";
            bdiv.children[bi].style.background=hex;
          }
        }
      }else if(fx==="dna"){
        // Animate DNA Double-Helix phase in THIS key's color
        var dpaths=box.querySelectorAll("path");
        if(dpaths.length===2){
          var dy1=2+Math.round((Math.sin(S.kfxTick*0.3+i)+1)*15);
          var dy2=34-dy1;
          dpaths[0].setAttribute("d","M0,18 Q15,"+dy1+" 30,18 T60,18");
          dpaths[0].setAttribute("stroke",hex);
          dpaths[1].setAttribute("d","M0,18 Q15,"+dy2+" 30,18 T60,18");
          dpaths[1].setAttribute("stroke",hex);
        }
      }else if(fx==="lava"){
        // Animate rising Lava Lamp blobs in THIS key's color
        var cirs=box.querySelectorAll("circle");
        if(cirs.length===3){
          for(var ci=0;ci<3;ci++){

/* WCAG 2.1 Contrast Badge & Recent 8-Color History Strip */
function updateWcagAndHistory(hex){
  if(!HEX.test(hex))return;
  var u=hex.toUpperCase();
  // Relative luminance calculation
  var c=rgb(u);
  var srgb=[c.r/255,c.g/255,c.b/255].map(function(v){return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
  var L=0.2126*srgb[0]+0.7152*srgb[1]+0.0722*srgb[2];
  var crWhite=(1.05)/(L+0.05),crBlack=(L+0.05)/0.05;
  var best=crWhite>=crBlack?{txt:"White",cr:crWhite}:{txt:"Black",cr:crBlack};
  var grade=best.cr>=7?"AAA":best.cr>=4.5?"AA":"Low";
  var wb=$("wcagBadge");
  if(wb){
    wb.textContent=grade+" "+best.txt+" ("+best.cr.toFixed(1)+":1)";
    wb.style.borderColor=grade==="Low"?"#EF4444":"#10B981";
    wb.style.color=grade==="Low"?"#FCA5A5":"#6EE7B7";
  }

  // Push to Recent 8-Color History Strip
  var idx=S.history.indexOf(u);
  if(idx>-1)S.history.splice(idx,1);
  S.history.unshift(u);
  if(S.history.length>8)S.history.pop();
  renderHistoryStrip();
}

function renderHistoryStrip(){
  var box=$("histStrip");if(!box)return;
  box.innerHTML="";
  S.history.forEach(function(hx){
    var b=D.createElement("button");
    b.type="button";b.className="hist-dot";
    b.style.background=hx;b.title="Reuse "+hx;
    b.onclick=function(){
      var q=hsl(hx);S.h=q.h;S.s=q.s;S.l=q.l;S.hex=hx;
      syncDial(true,false,false);
      announce(hx,"HISTORY",true,"HIST");
    };
    box.appendChild(b);
  });
}

var DEMO_MODES=[
  ["hawk-marquee","forefronthawk.com"],
  ["cascade-horiz","Horiz Cascade"],
  ["cascade-vert","Vert Waterfall"],
  ["cascade-diag","Diag Prism"],

// Generate the built-in 120-frame horizontal cascading marquee for "forefronthawk.com"
function buildHawkSampleFrames(rows,cols){
  var msg="   FOREFRONTHAWK.COM   ";
  var totalFrames=120; // well within the 300 allowable frames cap
  var frames=[];
  for(var f=0;f<totalFrames;f++){
    var fColors=[],fLabels=[];
    var shift=f%msg.length;
    var baseHue=(f*6)%360;
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        // Horizontal cascade: text scrolls right-to-left across columns, with rainbow gold/cyan/magenta wave
        var charIdx=(c+shift+(r*3))%msg.length;
        var ch=msg.charAt(charIdx);
        var isLetter=ch!==" ";
        var hue=(baseHue+c*28+r*40)%360;
        var hex=isLetter?hslHex(hue,95,58):hslHex((hue+180)%360,70,18);
        fColors.push(hex);
        // Row 0 shows the scrolling FOREFRONTHAWK.COM characters; Row 1 shows matching cascade wave or domain mirror
        var lbl=r===0?(isLetter?("["+ch+"]"):"···"):(c<17?"FOREFRONTHAWK.COM".charAt(c):"🦅");
        fLabels.push(lbl);
      }
    }
    frames.push({colors:fColors,labels:fLabels,ring:hslHex(baseHue,95,55)});
  }
  return frames;
}

var HAWK_SAMPLE_FRAMES=buildHawkSampleFrames(S.rows,S.cols);

function frame(t){
  if(!S.demo)return;
  if(t-S.t0>=S.demoSpeed){
    S.t0=t;
    S.phase=(S.phase+12)%360;
    var pat=S.demoPattern,n=cells.length;

    if(pat==="hawk-marquee"){
      if(HAWK_SAMPLE_FRAMES.length===0||HAWK_SAMPLE_FRAMES[0].colors.length!==n){
        HAWK_SAMPLE_FRAMES=buildHawkSampleFrames(S.rows,S.cols);
      }
      var hf=HAWK_SAMPLE_FRAMES[S.frameIdx%HAWK_SAMPLE_FRAMES.length];
      for(var i=0;i<n;i++){
        renderDemoCell(i,hf.colors[i]||"#38BDF8",hf.labels[i]);
      }
      setRing(hf.ring||"#38BDF8");
      S.frameIdx=(S.frameIdx+1)%HAWK_SAMPLE_FRAMES.length;
    }else if(pat==="custom-script"&&S.customFrames.length>0){
      var cf=S.customFrames[S.frameIdx%S.customFrames.length];
      for(var j=0;j<n;j++){
        var chx=(cf.colors&&cf.colors[j])||hslHex((S.phase+j*20)%360,90,55);
        var clb=(cf.labels&&cf.labels[j])||null;
        renderDemoCell(j,chx,clb);
      }
      setRing(cf.ring||cf.colors[0]||"#10B981");
      S.frameIdx=(S.frameIdx+1)%S.customFrames.length;
    }else if(pat==="cascade-horiz"){
      // Horizontal Left-to-Right Rainbow Wave Cascade
      for(var i1=0;i1<n;i1++){
        var c1=i1%S.cols;
        renderDemoCell(i1,hslHex((S.phase+c1*36)%360,94,55),null);
      }
      setRing(hslHex(S.phase,95,55));
    }else if(pat==="cascade-vert"){
      // Vertical Top-to-Bottom Waterfall Cascade
      for(var i2=0;i2<n;i2++){
        var r2=(i2/S.cols)|0,c2=i2%S.cols;
        renderDemoCell(i2,hslHex((S.phase*2+r2*75+c2*8)%360,92,54),null);
      }
      setRing(hslHex((S.phase*2)%360,95,55));
    }else if(pat==="cascade-diag"){
      // Diagonal Prism Cascade
      for(var i3=0;i3<n;i3++){
        var r3=(i3/S.cols)|0,c3=i3%S.cols;
        renderDemoCell(i3,hslHex((S.phase+c3*28+r3*48)%360,92,55),null);
      }
      setRing(hslHex(S.phase,95,55));
    }else if(pat==="matrix-rain"){
      // Matrix Digital Green Code Rain Cascade
      var mChars="012345789ZXYﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘ";
      for(var i4=0;i4<n;i4++){
        var r4=(i4/S.cols)|0,c4=i4%S.cols;
        var drop=((S.frameIdx+c4*3+r4*5)%8);
        var l4=drop===0?72:drop===1?52:drop===2?36:14;
        var mHex=hslHex(130,95,l4);
        var mCh=mChars.charAt((S.frameIdx+i4*7)%mChars.length);
        renderDemoCell(i4,mHex,mCh+" "+mCh);
      }
      setRing("#00FF41");
      S.frameIdx=(S.frameIdx+1)%300;
    }else if(pat==="plasma-spiral"){
      // Radial Center-Outward Plasma Spiral
      var midC=(S.cols-1)/2,midR=(S.rows-1)/2;
      for(var i5=0;i5<n;i5++){
        var r5=(i5/S.cols)|0,c5=i5%S.cols;
        var dist=Math.sqrt((c5-midC)*(c5-midC)+(r5-midR)*(r5-midR));
        var ang5=Math.atan2(r5-midR,c5-midC)*180/Math.PI;
        renderDemoCell(i5,hslHex((S.phase+dist*45+ang5+360)%360,94,55),null);
      }
      setRing(hslHex((S.phase+90)%360,95,55));
    }else{
      // Cyber Dual-Row Pulse Cascade
      for(var i6=0;i6<n;i6++){
        var r6=(i6/S.cols)|0,c6=i6%S.cols;
        var dir=r6%2===0?1:-1;
        var activeCol=((S.frameIdx*dir)%S.cols+S.cols)%S.cols;
        var isHit=c6===activeCol||c6===(activeCol+1)%S.cols;
        var h6=r6%2===0?320:190;
        renderDemoCell(i6,hslHex(h6,95,isHit?62:20),null);
      }
      setRing(hslHex((S.frameIdx*25)%360,95,55));
      S.frameIdx=(S.frameIdx+1)%300;
    }
  }
  S.raf=requestAnimationFrame(frame);
}

/* Custom 300-Frame Demo Script Template Downloader & Uploader */
function downloadScriptCsv(filename,framesList){
  var n=S.rows*S.cols;
  var hdr=["frame","ring_hex"];
  for(var k=1;k<=n;k++)hdr.push("k"+k+"_hex");
  for(var m=1;m<=n;m++)hdr.push("k"+m+"_label");
  var lines=[hdr.join(",")];
  var maxF=Math.min(300,framesList.length);
  for(var f=0;f<maxF;f++){
    var fr=framesList[f];
    var row=[f+1,fr.ring||"#10B981"];
    for(var i=0;i<n;i++)row.push((fr.colors&&fr.colors[i])||"#10B981");
    for(var j=0;j<n;j++)row.push(csvEscape((fr.labels&&fr.labels[j])||""));
    lines.push(row.join(","));
  }
  var blob=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob),a=D.createElement("a");
  a.href=url;a.download=filename;D.body.appendChild(a);a.click();D.body.removeChild(a);URL.revokeObjectURL(url);
}

$("scriptFileInput").onchange=function(e){
  var file=e.target.files&&e.target.files[0];if(!file)return;

  reader.onload=function(ev){
    try{
      var txt=String(ev.target.result||""),rows=txt.split(/\r?\n/);
      var n=S.rows*S.cols,parsed=[];
      for(var i=1;i<rows.length;i++){
        if(parsed.length>=300)break; // Strict 300-frame maximum cap
        var line=rows[i].trim();if(!line)continue;
        var cols=parseCsvLine(line);
        if(cols.length<2)continue;
        var ringHex=HEX.test(cols[1])?cols[1].toUpperCase():"#10B981";
        var fCols=[],fLbls=[];
        for(var k=0;k<n;k++){
          var chx=(cols[2+k]||"").trim().toUpperCase();
          fCols.push(HEX.test(chx)?chx:"#10B981");
          var clb=cols[2+n+k];
          fLbls.push(clb!=null&&clb!==""?String(clb).slice(0,8):null);
        }
        parsed.push({ring:ringHex,colors:fCols,labels:fLbls});
      }
      if(!parsed.length){toast("No valid frames found in script CSV");return}
      S.customFrames=parsed;
      S.demoPattern="custom-script";
      $("scriptStatusChip").textContent="Loaded: "+file.name.slice(0,18)+" ("+parsed.length+"/300 frames)";
      syncDemoPatternUi();save();
      stopDemo();startDemo(false);
      toast("Loaded Custom Script ("+parsed.length+"/300 frames) & Started Playback!");
    }catch(err){
      toast("Error parsing custom script CSV");
    }
    $("scriptFileInput").value="";
  };
  reader.readAsText(file);
};

$("fsSlidersToggle").onclick=function(){
  var next={off:"rgb",rgb:"hsl",hsl:"off"}[S.sl];
  S.sl=next;this.textContent="Sliders: "+next.toUpperCase();
  applyLook();save();
};
$("fsReadoutToggle").onclick=function(){
  S.ro=!S.ro;this.textContent="Readout: "+(S.ro?"On":"Off");
  applyLook();save();
};
$("fsDmodeCycle").onclick=function(){
  S.dmode={hue:"sat",sat:"light",light:"hue"}[S.dmode];
  this.textContent="Dial: "+S.dmode.toUpperCase();
  applyLook();save();
};
$("fsSoundCycle").onclick=function(){
  var list=["cherry","linear","bubble","beeps","scifi","subtle"];
  S.sndType=list[(list.indexOf(S.sndType)+1)%list.length];
  $("sndTypeSel").value=S.sndType;
  this.textContent="Sound: "+S.sndType;
  click(1100,.04);save();
};
$("fsUiThemeCycle").onclick=function(){
  var all=BUILTIN_UI_THEMES.map(function(x){return x[0]}).concat(S.customUiThemes.map(function(_,i){return"custom_"+i}));
  S.mode=all[(all.indexOf(S.mode)+1)%all.length]||"dark";
  applyUiTheme();applyLook();save();
};

/* Physical Keyboard Shortcuts */
var KM="1234567890qwertyuiopasdfghjkl";
window.addEventListener("keydown",function(e){var t=e.target&&e.target.tagName;if(t==="INPUT"||t==="SELECT"||e.ctrlKey||e.metaKey||e.altKey)return;
var k=e.key.toLowerCase(),i=k.length===1?KM.indexOf(k):-1;
if(i>-1&&i<cells.length)press(i);else if(k===" "){e.preventDefault();toggleAssign()}});

/* Readouts & Sliders */
function updRo(){var h=S.shown,c=rgb(h),q=hsl(h);$("roSw").style.background=h;$("roHex").textContent=hexTxt(h);
$("roRgb").textContent="rgb("+c.r+", "+c.g+", "+c.b+")";$("roHsl").textContent="hsl("+q.h+", "+q.s+"%, "+q.l+"%)"}
var SL=[0,1,2].map(function(i){return $("s"+i)}),SV=[0,1,2].map(function(i){return $("v"+i)}),SN=[0,1,2].map(function(i){return $("n"+i)});
function slLabels(){var rg=S.sl==="rgb",nm=rg?["R","G","B"]:["H","S","L"],mx=rg?[255,255,255]:[360,100,100],col=rg?["#EF4444","#22C55E","#3B82F6"]:["#A78BFA","#A78BFA","#A78BFA"];
for(var i=0;i<3;i++){SN[i].textContent=nm[i];SL[i].max=mx[i];SL[i].style.accentColor=col[i]}}
function slUpdate(){var rg=S.sl==="rgb",c=rgb(S.hex),v=rg?[c.r,c.g,c.b]:[S.h,S.s,S.l];for(var i=0;i<3;i++){SL[i].value=v[i];SV[i].textContent=v[i]}}
SL.forEach(function(sl,i){sl.addEventListener("input",function(){var v=SL.map(function(x){return+x.value});
if(S.sl==="rgb"){var hx="#"+v.map(function(n){return n.toString(16).padStart(2,"0")}).join("").toUpperCase(),q=hsl(hx);S.h=q.h;S.s=q.s;S.l=q.l;S.hex=hx}
else{S.h=v[0];S.s=v[1];S.l=v[2]}
SV[i].textContent=sl.value;syncDial(true,true)});
sl.addEventListener("change",function(){if(!S.assign)announce(S.hex,"SLIDER",true,"SLIDER")})});

/* Look & Layout Options */
var DSN=[110,150,200,250,300],DSV=[10,14,20,28,36],ACC={sky:"#38BDF8",green:"#34D399",amber:"#FBBF24",rose:"#FB7185",violet:"#A78BFA"};
function applyLook(){
  var r=D.documentElement.style,b=D.body.classList,g=$("grid");
  r.setProperty("--accent",ACC[S.accent]);
  r.setProperty("--font",FONTS[S.font]||FONTS.system);
  r.setProperty("--dsn","min("+DSN[S.dsz]+"px,78vw)");

  // Plate material finish override
  var pl=$("plateEl");
  if(S.plateMat!=="theme"&&PLATES[S.plateMat]){
    pl.style.background=PLATES[S.plateMat].bg;
    pl.style.borderColor=PLATES[S.plateMat].bd;
  }else{
    pl.style.background="";pl.style.borderColor="";
  }

  var pos=S.dpos==="auto"?(innerWidth>innerHeight*1.05?"right":"bottom"):S.dpos,x=DSV[S.dsz],side=pos==="right"||pos==="left",sl=S.sl!=="off";
  var drawerH=($("fsDrawer")&&!$("fsDrawer").hidden)?5.2:0;
  r.setProperty("--dsf",side?"min("+(x*1.6)+"dvh,36vw)":"min("+x+"dvh,60vw)");
  r.setProperty("--dv",(pos==="bottom"?x:0)+"dvh");
  r.setProperty("--ex",(4.6+drawerH+(S.ro?3.4:0)+(sl?4.2:0)+(1+(S.ro?1:0)+(sl?1:0))*.8+1.1)+"dvh");
  ["bottom","right","left","hidden"].forEach(function(p){b.toggle("dp-"+p,p===pos)});
  b.toggle("dsmall",S.dsz<2);
  $("ring").className=S.dtype==="knob"?"":S.dtype;
  g.dataset.shape=S.shape;g.dataset.cap=S.cap;g.dataset.glow=S.glow?"on":"off";g.dataset.hex=S.showHex?"on":"off";
  r.setProperty("--gp",[0,3,6,10][S.gap]+"px");r.setProperty("--gpf",[0,.6,1.2,2][S.gap]+"vmin");
  $("ro").hidden=!S.ro;$("slBox").hidden=!sl;slLabels();syncDial(false);
}

var UI=[
  ["Dial size","dsz",[[0,"Small"],[1,"Medium"],[2,"Large"],[3,"X-Large"],[4,"Max"]]],
  ["Dial style","dtype",[["knob","Knob"],["rainbow","Rainbow ring"],["min","Minimal"]]],
  ["Dial controls","dmode",[["hue","Hue"],["sat","Saturation"],["light","Lightness"]]],
  ["Dial position (FS)","dpos",[["auto","Auto"],["bottom","Bottom"],["right","Right"],["left","Left"],["hidden","Hidden"]]],
  ["Dial snap","snap",[[0,"Free"],[5,"5°"],[15,"15°"],[30,"30°"]]],
  ["Sliders","sl",[["off","Off"],["rgb","RGB"],["hsl","HSL"]]],
  ["Readouts","ro",[[true,"On"],[false,"Off"]]],
  ["Key shape","shape",[["round","Rounded"],["square","Square"],["oval","Oval"]]],
  ["Key style","cap",[["white","White PBT"],["flat","Flat Color"],["dark","Dark Stealth"],["ceramic","Ceramic Pro"]]],
  ["Key gap","gap",[[0,"None"],[1,"Tight"],[2,"Normal"],[3,"Wide"]]],
  ["Key glow","glow",[[true,"On"],[false,"Off"]]],
  ["Hex on keys","showHex",[[true,"On"],[false,"Off"]]],
  ["Accent","accent",[["sky","Sky"],["green","Green"],["amber","Amber"],["rose","Rose"],["violet","Violet"]]],
  ["Haptics","hap",[[0,"Off"],[10,"Light"],[18,"Medium"],[30,"Strong"]]],
  ["Hex text","hash",[[true,"With #"],[false,"No #"]]],
  ["Hex case","lower",[[false,"UPPER"],[true,"lower"]]]
];

function buildOpts(){
  var box=$("opts");box.innerHTML='<span class="subhead">3B. Dial &amp; Key Look</span>';
  UI.forEach(function(u){
    var l=D.createElement("label"),sel=D.createElement("select");
    l.appendChild(D.createTextNode(u[0]+" "));
    u[2].forEach(function(o,i){var op=D.createElement("option");op.value=i;op.textContent=o[1];if(o[0]===S[u[1]])op.selected=true;sel.appendChild(op)});
    sel.onchange=function(){S[u[1]]=u[2][+this.value][0];save();applyLook();updRo();paintAll();$("out").textContent=fmt(S.shown,"OPT")};
    l.appendChild(sel);box.appendChild(l);
  });
}

function fullRefreshUi(){
  opts($("rowsSel"),1,6,S.rows);opts($("colsSel"),2,12,S.cols);
  if($("fsRowsSel"))opts($("fsRowsSel"),1,6,S.rows);
  if($("fsColsSel"))opts($("fsColsSel"),2,12,S.cols);
  $("sndTypeSel").value=S.sndType;$("fontSel").value=S.font;$("plateSel").value=S.plateMat;
  if(S.conn==="ble")S.conn="windows";
  $("usbBox").hidden=S.conn!=="usb";
  updateDragChip(S.shown||"#10B981",fmt(S.shown||"#10B981","INIT"));
  var map={windows:"🪟 Windows PC",usb:"🔌 USB Cable",chrome:"🌐 Chrome Dock"};
  $("connChip").textContent=map[S.conn]||"🪟 Windows PC";
  syncCSeg();syncTSeg();syncFSeg();syncWordAndPasteUi();syncDemoPatternUi();
  build();buildOpts();applyUiTheme();applyLook();updRo();themeUi();toggles();rebuildConfigSlots();
}

$("resetBtn").onclick=function(){try{localStorage.removeItem("hawkchroma_v4");localStorage.removeItem("hawkchroma_v3")}catch(e){}location.reload()};



var rt=0;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(applyLook,120)});

fullRefreshUi();
})();
</script>
