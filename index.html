<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090E">
<title>HawkChroma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700;800&family=Orbitron:wght@600;800&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090E;--panel:#12141A;--line:#262A34;--text:#F1F5F9;--mute:#94A3B8;--plate:#4B505C;--accent:#38BDF8;
  --deck1:#1A1C23;--deck2:#101216;--deck-border:#2D323E;--plate-border:#6E7485;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark
}
@media(prefers-color-scheme:light){:root[data-theme="auto"]{--bg:#E8EBF0;--panel:#F8FAFC;--line:#CBD5E1;--text:#0F172A;--mute:#475569;--plate:#8B93A3;--deck1:#CBD5E1;--deck2:#94A3B8;--deck-border:#64748B;color-scheme:light}}
:root[data-theme="light"]{--bg:#E8EBF0;--panel:#F8FAFC;--line:#CBD5E1;--text:#0F172A;--mute:#475569;--plate:#8B93A3;--deck1:#CBD5E1;--deck2:#94A3B8;--deck-border:#64748B;color-scheme:light}
:root[data-theme="midnight"]{--bg:#020617;--panel:#0F172A;--line:#1E293B;--text:#E2E8F0;--mute:#64748B;--plate:#1E293B;--deck1:#0F172A;--deck2:#020617;--deck-border:#334155}
:root[data-theme="cyberpunk"]{--bg:#0D0221;--panel:#19053B;--line:#4C1D95;--text:#F0ABFC;--mute:#C084FC;--plate:#2E1065;--deck1:#240046;--deck2:#10002B;--deck-border:#7E22CE}
:root[data-theme="emerald"]{--bg:#021612;--panel:#062821;--line:#0F4C3E;--text:#D1FAE5;--mute:#6EE7B7;--plate:#114237;--deck1:#06342B;--deck2:#021B16;--deck-border:#059669}
:root[data-theme="crimson"]{--bg:#160408;--panel:#280911;--line:#501322;--text:#FFE4E6;--mute:#FDA4AF;--plate:#3F101C;--deck1:#310B15;--deck2:#190409;--deck-border:#BE123C}
:root[data-theme="nord"]{--bg:#2E3440;--panel:#3B4252;--line:#4C566A;--text:#ECEFF4;--mute:#D8DEE9;--plate:#434C5E;--deck1:#3B4252;--deck2:#2E3440;--deck-border:#4C566A}
:root[data-theme="mocha"]{--bg:#1E1E2E;--panel:#181825;--line:#313244;--text:#CDD6F4;--mute:#A6ADC8;--plate:#45475A;--deck1:#26273B;--deck2:#11111B;--deck-border:#585B70}

body.party-mode{transition:none!important}
body.party-mode .bar,body.party-mode .side,body.party-mode .deck,body.party-mode .plate{border-color:var(--accent)!important;box-shadow:0 0 22px var(--accent)!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
input, textarea, select { -webkit-user-select: text !important; user-select: text !important; }
[hidden]{display:none!important}
body{-webkit-user-select:none;user-select:none;margin:0;background:var(--bg);color:var(--text);font:500 13.5px/1.4 var(--font);min-height:100vh;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.bar-head{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.bar-body{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;padding-top:6px;border-top:1px solid var(--line)}

button,select,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 9px;min-height:35px;touch-action:manipulation;cursor:pointer}
button:hover{filter:brightness(1.12)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent);min-height:auto}
input[type=color]{padding:2px;width:42px;min-height:32px;height:32px}
.brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px}.brand i{font-style:normal;color:var(--accent)}
.chip{font:600 11px var(--mono);padding:3px 8px;border-radius:8px;border:1px solid var(--line);color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:2px;border:1px solid var(--line);border-radius:11px;padding:2px;max-width:100%}
.seg button{flex:1 1 auto;text-align:center;border:0;min-height:28px;padding:3px 7px;background:none;color:var(--mute);font-weight:700;font-size:11.5px;border-radius:8px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#04121C}
.readout{display:flex;align-items:center;gap:10px;flex:1 1 200px}
#sw{width:26px;height:26px;border-radius:7px;border:2px solid var(--text);flex:none}
#out{font:700 14px var(--mono)}
#toast{color:var(--mute);font-size:11.5px;min-height:15px}

.deck{display:flex;flex-direction:column;gap:12px;background:linear-gradient(145deg,var(--deck1),var(--deck2));border:3px solid var(--deck-border);border-radius:22px;padding:12px}
body.layout-desktop .deck{flex-direction:row}
body.layout-mobile .deck{flex-direction:column !important}
@media(min-width:920px){ body:not(.layout-mobile) .deck{flex-direction:row} }

.plate{flex:1;min-width:0;background:var(--plate);border:2px solid var(--plate-border);border-radius:16px;padding:10px;box-shadow:inset 0 3px 10px rgba(0,0,0,.55)}
#grid{display:grid;grid-template-columns:repeat(var(--cols,10),minmax(0,1fr));grid-auto-rows:var(--kh,76px);gap:var(--gp,6px)}
.key{position:relative;min-width:0;padding:3px;border-radius:10px;background:#1B1E26;border:2px solid var(--k);box-shadow:0 0 var(--glow-r,10px) var(--k);cursor:pointer;transition:transform .07s}
.key:active,.key.hit{transform:translateY(3px) scale(.96)}
.cap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-radius:7px;padding:4px 2px 3px;background:linear-gradient(180deg,#fff,#E2E8F0);color:#0F172A;overflow:hidden;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);font-family:var(--font)}
.cap b{display:block;width:100%;height:28%;max-height:16px;border-radius:4px;background:var(--k);border:1px solid rgba(0,0,0,.25)}
.cap span{font:800 clamp(7.5px,2.4vw,11.5px) var(--font);max-width:100%;overflow:hidden;white-space:nowrap}
.cap small{font:600 8.5px var(--mono);color:#64748B}

.side{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;min-width:248px}
#ring{--rp:12px;border-radius:50%;padding:var(--rp);border:2px solid rgba(255,255,255,.3);background:var(--rb,#10B98160);box-shadow:0 0 30px var(--rc,#10B981)}
#knob{position:relative;width:calc(var(--dsn,150px) - 2*var(--rp));height:calc(var(--dsn,150px) - 2*var(--rp));border-radius:50%;background:radial-gradient(circle at 35% 35%,#323640,#14161B 78%);border:5px dashed #5C6270;touch-action:none;cursor:grab}
#notch{width:max(5px,calc(var(--dsn,150px)*.045));height:calc(var(--dsn,150px)*.17);background:#fff;border-radius:4px;margin:6px auto 0}
#kinfo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none;color:#fff;font:700 calc(var(--dsn,150px)*.075) var(--mono)}
#angle{font-size:calc(var(--dsn,150px)*.1)}
#hue{width:100%;max-width:240px}

/* Mobile Layout Overrides */
body.layout-mobile #grid { grid-template-columns: repeat(min(var(--cols,10), 5), minmax(0,1fr)); grid-auto-rows: 58px; }
body.layout-mobile .side { min-width: 100%; width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar" id="sec1Bar">
    <div class="bar-head">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="brand">🦅 Hawk<i>Chroma</i></span>
        <div class="seg" id="viewModeSeg" role="group" aria-label="View Layout">
          <button data-mode="auto" aria-pressed="true">Auto</button>
          <button data-mode="desktop" aria-pressed="false">🖥️ Desktop</button>
          <button data-mode="mobile" aria-pressed="false">📱 Mobile</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <button id="partyBtn" class="chip">Party: Off</button>
      </div>
    </div>
    <div class="bar-body">
      <div class="seg" id="cSeg">
        <button data-v="windows" aria-pressed="true">🪟 Windows</button>
        <button data-v="usb" aria-pressed="false">🔌 USB</button>
        <button data-v="chrome" aria-pressed="false">🌐 Chrome Dock</button>
      </div>
      <div class="seg" id="fSeg">
        <button data-v="hex" aria-pressed="true">HEX</button>
        <button data-v="rgb" aria-pressed="false">RGB</button>
        <button data-v="hsl" aria-pressed="false">HSL</button>
      </div>
      <button id="fillTextToggleBtn" style="font-weight:700">🪣 Mode: Fill</button>
      <button id="demoBtn">Demo</button>
    </div>
  </header>

  <section class="bar">
    <div class="readout">
      <div id="sw" style="background:#10B981"></div>
      <div>
        <span id="out">#10B981</span>
        <div id="toast">Tap any key to copy its color</div>
      </div>
    </div>
    <div id="dragChip" class="chip" draggable="true" style="cursor:grab;background:#10B981;color:#0F172A;font-weight:700">✋ Drag Color</div>
  </section>

  <main class="deck">
    <div class="plate" id="plateEl">
      <div id="grid"></div>
    </div>
    <aside class="side" id="sideEl">
      <div id="ring">
        <div id="knob"><div id="notch"></div><div id="kinfo"><span>HUE</span><span id="angle">160°</span><span id="dhex">#10B981</span></div></div>
      </div>
      <input id="hue" type="range" min="0" max="360" value="160">
      <button id="assignBtn" style="width:100%">Assign dial color to a key</button>
    </aside>
  </main>
</div>

<script>
(function(){
"use strict";
var D=document, $=function(id){return D.getElementById(id)};
var S = {
  rows: 2, cols: 10, hex: "#10B981", shown: "#10B981",
  fmt: "hex", officePaste: "rich-cell", viewMode: "auto",
  assign: false, h: 160, s: 92, l: 54, ang: 160,
  keys: ["#EF4444","#F97316","#F59E0B","#10B981","#06B6D4","#3B82F6","#6366F1","#8B5CF6","#EC4899","#F43F5E",
         "#FCA5A5","#FDBA74","#FDE047","#86EFAC","#67E8F9","#93C5FD","#A5B4FC","#C4B5FD","#F9A8D4","#FDA4AF"],
  demo: false, party: false, partyRaf: 0
};

/* Bulletproof Copy for Android, Edge, and iOS */
function copyText(t, hex) {
  return new Promise(function(resolve) {
    var outText = (S.officePaste === "raw-hex" && hex) ? hex.replace("#", "").toUpperCase() : t;
    var richHtml = hex ? '<table style="border-collapse:collapse"><tr><td bgcolor="'+hex+'" style="background-color:'+hex+';color:#fff;padding:6px 12px;font-family:sans-serif;font-weight:bold">'+outText+'</td></tr></table>' : null;

    function fallbackExec() {
      try {
        var el = D.createElement("textarea");
        el.value = outText;
        el.setAttribute("readonly", "");
        el.style.cssText = "position:fixed;top:0;left:0;opacity:0.01;pointer-events:none;z-index:-1;-webkit-user-select:text;user-select:text;";
        D.body.appendChild(el);
        el.focus();
        el.select();
        el.setSelectionRange(0, outText.length);
        var ok = D.execCommand("copy");
        D.body.removeChild(el);
        resolve(!!ok);
      } catch (e) { resolve(false); }
    }

    if (!navigator.clipboard || !window.isSecureContext) {
      fallbackExec();
      return;
    }

    if (richHtml && typeof ClipboardItem !== "undefined" && navigator.clipboard.write) {
      try {
        var item = new ClipboardItem({
          "text/plain": new Blob([outText], { type: "text/plain" }),
          "text/html": new Blob([richHtml], { type: "text/html" })
        });
        navigator.clipboard.write([item]).then(
          function() { resolve(true); },
          function() {
            navigator.clipboard.writeText(outText).then(function() { resolve(true); }, fallbackExec);
          }
        );
      } catch (err) {
        navigator.clipboard.writeText(outText).then(function() { resolve(true); }, fallbackExec);
      }
    } else {
      navigator.clipboard.writeText(outText).then(function() { resolve(true); }, fallbackExec);
    }
  });
}

function toast(msg) {
  $("toast").textContent = msg;
}

function renderGrid() {
  var g = $("grid"); g.innerHTML = "";
  g.style.setProperty("--cols", S.cols);
  S.keys.forEach(function(col, idx) {
    var k = D.createElement("button");
    k.type = "button"; k.className = "key";
    k.style.setProperty("--k", col);
    k.innerHTML = '<div class="cap"><b></b><span>K' + (idx + 1) + '</span><small>' + col + '</small></div>';
    k.onclick = function() {
      if (S.assign) {
        S.keys[idx] = S.hex;
        S.assign = false;
        $("assignBtn").textContent = "Assign dial color to a key";
        renderGrid();
        return;
      }
      S.shown = col;
      $("sw").style.background = col;
      $("out").textContent = col;
      $("out").style.color = col;
      $("dragChip").style.background = col;
      copyText(col, col).then(function(ok) {
        toast(ok ? "Copied " + col + " to clipboard!" : "Select drag chip to copy");
      });
    };
    g.appendChild(k);
  });
}

/* View Mode Selector (Auto / Desktop / Mobile) */
function setViewMode(mode) {
  S.viewMode = mode;
  D.body.classList.remove("layout-desktop", "layout-mobile");
  if (mode === "desktop") D.body.classList.add("layout-desktop");
  if (mode === "mobile") D.body.classList.add("layout-mobile");
  $("viewModeSeg").querySelectorAll("button").forEach(function(b) {
    b.setAttribute("aria-pressed", b.dataset.mode === mode);
  });
}
$("viewModeSeg").querySelectorAll("button").forEach(function(b) {
  b.onclick = function() { setViewMode(b.dataset.mode); };
});

/* Rotary Knob Engine */
function hslToHex(h, s, l) {
  l /= 100;
  var a = s * Math.min(l, 1 - l) / 100;
  var f = function(n) {
    var k = (n + h / 30) % 12;
    return Math.round(255 * (l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1))).toString(16).padStart(2, "0");
  };
  return ("#" + f(0) + f(8) + f(4)).toUpperCase();
}
function updateDial(ang) {
  ang = (Math.round(ang) % 360 + 360) % 360;
  S.ang = ang; S.h = ang; S.hex = hslToHex(S.h, S.s, S.l);
  $("knob").style.transform = "rotate(" + ang + "deg)";
  $("kinfo").style.transform = "rotate(" + (-ang) + "deg)";
  $("angle").textContent = ang + "°";
  $("dhex").textContent = S.hex;
  $("ring").style.setProperty("--rc", S.hex);
  $("ring").style.setProperty("--rb", S.hex + "60");
}
var knob = $("knob"), dragging = false;
knob.addEventListener("pointerdown", function(e) { dragging = true; knob.setPointerCapture(e.pointerId); });
window.addEventListener("pointermove", function(e) {
  if (!dragging) return;
  var r = knob.getBoundingClientRect();
  var deg = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI + 90;
  updateDial(deg);
});
window.addEventListener("pointerup", function() { dragging = false; });
$("hue").oninput = function() { updateDial(this.value); };

$("assignBtn").onclick = function() {
  S.assign = !S.assign;
  this.textContent = S.assign ? "Tap any key to assign " + S.hex : "Assign dial color to a key";
};

$("fillTextToggleBtn").onclick = function() {
  S.officePaste = S.officePaste === "rich-cell" ? "rich-text" : "rich-cell";
  this.textContent = S.officePaste === "rich-cell" ? "🪣 Mode: Fill" : "🔤 Mode: Text";
};

renderGrid();
updateDial(160);
})();
</script>
</body>
</html>
